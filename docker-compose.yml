services:
  race-server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 2567
    expose:
      - "2567"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      race-server:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in the uncommitted .env file}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
