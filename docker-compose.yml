services:
  race-server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 2567
      DATABASE_URL: postgresql://heartline:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/heartline
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "2567"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      race-server:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in the uncommitted .env file}

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: heartline
      POSTGRES_USER: heartline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heartline -d heartline"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
