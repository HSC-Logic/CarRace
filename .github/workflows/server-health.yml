name: Multiplayer health
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: HTTPS health
        run: curl --fail --show-error --max-time 15 https://carrace.hsclogic.com/health
      - name: WSS room handshake
        run: node scripts/public-smoke.mjs
